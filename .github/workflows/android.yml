name: Build Brio APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reuse debug signing key for future updates
        uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: brio-debug-signing-v2
      - name: Prepare a stable debug signing certificate
        run: |
          mkdir -p .ci-signing
          if [ ! -f .ci-signing/debug.keystore ]; then
            keytool -genkeypair -keystore .ci-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint, and build
        env:
          BRIO_DEBUG_KEYSTORE: .ci-signing/debug.keystore
        run: bash gradlew :core:test :app:lintDebug :app:assembleDebug
      - name: Publish installable update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          gh release create "v$VERSION" app/build/outputs/apk/debug/app-debug.apk \
            --title "Brio $VERSION" --notes "Installable Android build for phone, tablet, and TV. Use Settings → About → Check for updates in Brio for future versions." --latest
      - name: Export public signing fingerprints
        run: '"$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee brio-signing-fingerprints.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: Brio-signing-fingerprints
          path: brio-signing-fingerprints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Brio-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html


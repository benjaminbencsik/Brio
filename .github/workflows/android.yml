name: Build Brio APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reuse debug signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: brio-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint, and build
        run: bash gradlew :core:test :app:lintDebug :app:assembleDebug
      - name: Export public signing fingerprints
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android > brio-signing-fingerprints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Brio-signing-fingerprints
          path: brio-signing-fingerprints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Brio-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html

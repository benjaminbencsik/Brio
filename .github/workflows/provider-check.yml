name: Check provider candidate
on:
  push:
    paths:
      - '.github/workflows/provider-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check manifest and direct stream results
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base = "https://87d6a6ef6b58-webstreamrmbg.baby-beamup.club"
          def fetch(path):
              req = urllib.request.Request(base + path, headers={"User-Agent": "Brio-provider-check/1.0"})
              with urllib.request.urlopen(req, timeout=55) as response:
                  data = response.read(1000000)
                  return json.loads(data)
          manifest = fetch("/manifest.json")
          assert "stream" in manifest.get("resources", []), "No stream resource"
          print("Manifest:", manifest.get("name"), manifest.get("version"))
          found = 0
          for identifier in ["tt1254207", "tt0111161"]:
              result = fetch("/stream/movie/" + identifier + ".json")
              direct = [s for s in result.get("streams", []) if s.get("url", "").startswith("https://")]
              print("Title", identifier, "direct HTTPS results =", len(direct))
              found += len(direct)
          assert found, "Provider returned no direct HTTPS sources for either test title"
          PY
